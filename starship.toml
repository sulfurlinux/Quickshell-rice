# Schema für automatische Editor-Vervollständigung
"$schema" = 'https://starship.rs/config-schema.json'

# Fügt eine leere Zeile vor jedem neuen Befehl ein (für bessere Lesbarkeit)
add_newline = true

# Das Eingabezeichen am Anfang (z.B. ein schlichtes '>' oder '->')
[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'

# Beispiel: Das Verzeichnis-Modul etwas schlichter halten
[directory]
truncation_length = 3
truncate_to_repo = true

# Falls du bestimmte Module komplett ausschalten willst (z.B. Paket-Versionen etc.):
[package]
disabled = true
